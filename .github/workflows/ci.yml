name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        working-directory: backend
        run: pytest

  web-and-extension:
    name: Web and extension checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test web frontend
        run: npm run test --workspace=sauri-frontend
      - name: Typecheck web frontend
        run: npm run typecheck --workspace=sauri-frontend
      - name: Build web frontend
        run: npm run build --workspace=sauri-frontend
      - name: Test extension
        run: npm run test --workspace=sauri-extension
      - name: Typecheck extension
        run: npm run typecheck --workspace=sauri-extension
      - name: Build extension
        run: npm run build --workspace=sauri-extension
