# Secret-free CI for Sauri (issue #497).
#
# Policy:
#   - A check that passes on `main` today is BLOCKING.
#   - A check whose scope is known to be red on `main` is non-blocking
#     (`continue-on-error: true`) and names the issue that owns the debt, so the
#     failure stays visible in the run log and in the step status instead of
#     blocking every pull request.
#   - Promote a step back to blocking by removing its `continue-on-error` line in
#     the same commit that makes that scope green.
#
# Known-red scopes and their tracking issues (measured on origin/main @ 81a0932,
# 2026-10-21, in the exact CI runtime: Python 3.11.17, ruff 0.17.1, mypy 2.4.0,
# pytest 9.1.1, Node 20.20.2, npm 10.8.2):
#   backend ruff        -> #228  (lint baseline debt on main: 26 findings)
#   backend mypy        -> #228  (type baseline debt on main: 24 errors in 7 files)
#   backend pytest      -> #248  (collection error: app.transcription.processing_pipeline
#                          is the module T-6/T-15 still has to create; the RED test
#                          that imports it is already on main)
#                          #407, #491, #492, #493 (Alembic 009 lineage and width guards)
#                          #249, #250, #241 (speaker-review PUT schema and routes)
#                          #505  (live MinIO playback integration test: needs a
#                          disposable object-store environment; the test itself was
#                          implemented by closed #309)
#   frontend vitest     -> #304  (typed playback and transcript API mapping)
#                          #251  (per-speaker review in the transcript view)
#   frontend tsc        -> #304  (Transcript.segments contract in @sauri/shared-types)
#                          #189  (frontend test environment readiness)
#
# Totals measured in that runtime: ruff 26 findings; mypy 24 errors in 7 files;
# pytest 4 failed, 283 passed, 4 skipped, 1 collection error; frontend vitest
# 10 failed, 21 passed; frontend tsc 6 errors. The Hypothesis deadline flakes
# seen on a slower local 3.13 virtualenv do not reproduce in the CI runtime, so
# they are not listed as a known-red scope. The counts move as the tool versions
# and `main` move; the issue references are the contract, not the counts.
#
# `npm audit --omit=dev` reports 0 vulnerabilities; the advisories `npm ci`
# prints are all in development dependencies.
#
# Green scopes kept blocking: extension vitest, extension tsc, extension build,
# frontend build.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORE_BUCKET: sauri-playback-${{ github.run_id }}
      MINIO_ROOT_USER: sauri-ci-${{ github.run_id }}
      MINIO_ROOT_PASSWORD: ${{ format('sauri-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      PLAYBACK_TEST_FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Start disposable MinIO
        run: >-
          docker run --detach --name sauri-ci-minio --publish 9000:9000
          --env MINIO_ROOT_USER="$MINIO_ROOT_USER"
          --env MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD"
          --env MINIO_API_CORS_ALLOW_ORIGIN="$PLAYBACK_TEST_FRONTEND_ORIGIN"
          minio/minio:latest server /data --console-address ":9001"
      - name: Wait for MinIO and configure the disposable bucket
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$OBJECT_STORE_ENDPOINT/minio/health/ready"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import os

          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["OBJECT_STORE_ENDPOINT"],
              aws_access_key_id=os.environ["MINIO_ROOT_USER"],
              aws_secret_access_key=os.environ["MINIO_ROOT_PASSWORD"],
              config=Config(signature_version="s3v4"),
          )
          bucket = os.environ["OBJECT_STORE_BUCKET"]
          client.create_bucket(Bucket=bucket)
          PY
      - name: "Backend lint (ruff) - non-blocking, tracked by #228"
        working-directory: backend
        continue-on-error: true
        run: ruff check .
      - name: "Backend type check (mypy) - non-blocking, tracked by #228"
        working-directory: backend
        continue-on-error: true
        run: mypy .
      - name: "Live MinIO playback test (pytest) - issue #505"
        working-directory: backend
        run: >-
          pytest
          tests/meetings/test_playback_storage_integration.py::test_signed_playback_source_supports_range_and_frontend_cors
          -q
      - name: "Backend tests (pytest) - non-blocking, tracked by #248"
        working-directory: backend
        continue-on-error: true
        run: pytest --continue-on-collection-errors

  web-and-extension:
    name: Web and extension checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: "Frontend tests (vitest) - non-blocking, tracked by #304"
        continue-on-error: true
        run: npm run test --workspace=sauri-frontend
      - name: "Frontend type check (tsc) - non-blocking, tracked by #304"
        continue-on-error: true
        run: npm run typecheck --workspace=sauri-frontend
      - name: "Frontend build (vite)"
        run: npm run build --workspace=sauri-frontend
      - name: "Extension tests (vitest)"
        run: npm run test --workspace=sauri-extension
      - name: "Extension type check (tsc)"
        run: npm run typecheck --workspace=sauri-extension
      - name: "Extension build (vite)"
        run: npm run build --workspace=sauri-extension
