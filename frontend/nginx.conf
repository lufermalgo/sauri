# Rendered by the nginx image entrypoint (envsubst) into /etc/nginx/conf.d/default.conf.
# Only ${SAURI_*} variables are substituted; every other $name below is an nginx variable.

# HSTS is sent only when the request reached nginx over HTTPS (directly or through a TLS proxy
# that sets X-Forwarded-Proto); an empty value makes add_header skip the header.
map "$scheme:$http_x_forwarded_proto" $sauri_hsts {
    default "";
    "~^https:" "max-age=31536000; includeSubDomains";
    "~:https$" "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    # Uploads reach the API through this proxy; keep in step with the API cap MAX_UPLOAD_BYTES (4 GiB).
    client_max_body_size 4g;

    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    # Keep the browser authority (including a non-default published port) so
    # upstream canonical-path redirects remain on the portal origin.
    proxy_set_header Host $http_host;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /portal-health {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api-health {
        add_header Strict-Transport-Security $sauri_hsts always;
        proxy_pass http://api:8000/health;
    }

    # API responses carry their own security headers (added by the API); nginx adds only HSTS.
    location /api/ {
        add_header Strict-Transport-Security $sauri_hsts always;
        # No trailing URI: preserve the full API path and query string.
        proxy_pass http://api:8000;
    }

    location /assets/ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # add_header in a location replaces the ones inherited from the server level, hence the include.
    location = /index.html {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
