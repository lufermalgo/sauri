# Security headers for the portal (static files). Rendered by the nginx image entrypoint (envsubst)
# into /etc/nginx/conf.d/snippets/security-headers.conf and included from each location, because
# add_header in a location replaces the ones inherited from the server level.
#
# CSP decisions:
# - script-src 'self' plus one sha256: the only inline script is the theme bootstrap in
#   index.html (applied before first paint). The Docker build hashes the exact bytes Vite emits
#   and substitutes the value for __INLINE_SCRIPT_HASH__.
# - style-src 'self': the built CSS is a same-origin file; React sets inline styles through the
#   CSSOM, which CSP does not block.
# - img-src / media-src include the object-store origin because thumbnails and playback use
#   short-lived signed S3 links that the browser loads directly (SAURI_OBJECT_STORE_ORIGIN is the
#   same value as OBJECT_STORE_PUBLIC_ENDPOINT).
# - API calls are same-origin (/api/), so connect-src is 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__INLINE_SCRIPT_HASH__'; style-src 'self'; img-src 'self' data: blob: ${SAURI_OBJECT_STORE_ORIGIN}; media-src 'self' blob: ${SAURI_OBJECT_STORE_ORIGIN}; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
add_header Strict-Transport-Security $sauri_hsts always;
