name: sauri

services:
  # Built portal; API stays same-origin, signed media links remain direct S3.
  portal:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${PORTAL_PORT:-5173}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/portal-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - sauri-net

  # --- API (FastAPI) ---
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://sauri:sauri_dev@postgres:5432/sauri
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_PUBLIC_ENDPOINT=${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9000}
      - OBJECT_STORE_BUCKET=sauri-recordings
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - QUEUE_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_MESSAGE_SIGNING_KEY=${QUEUE_MESSAGE_SIGNING_KEY:?Set a private queue message signing key}
      - ASR_PROVIDER=${ASR_PROVIDER:-local}
      - ASR_LOCAL_URL=${ASR_LOCAL_URL:-http://host.docker.internal:8001}
      - DIARIZATION_LOCAL_URL=${DIARIZATION_LOCAL_URL:-http://host.docker.internal:8002}
      - ASR_TIMEOUT_SECONDS=${ASR_TIMEOUT_SECONDS:-3600}
      - DIARIZATION_TIMEOUT_SECONDS=${DIARIZATION_TIMEOUT_SECONDS:-3600}
      - ASR_CLOUD_API_KEY=${ASR_CLOUD_API_KEY:-}
      - ASR_CLOUD_ENDPOINT=${ASR_CLOUD_ENDPOINT:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - SPEAKER_EXCERPT_ACTIVE_KEY_ID=${SPEAKER_EXCERPT_ACTIVE_KEY_ID:?Set a managed excerpt encryption key ID}
      - SPEAKER_EXCERPT_KEYRING=${SPEAKER_EXCERPT_KEYRING:?Set a managed versioned excerpt keyring}
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
    networks:
      - sauri-net

  # --- Worker (procesamiento asíncrono: transcripción, retención) ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://sauri:sauri_dev@postgres:5432/sauri
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_BUCKET=sauri-recordings
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - QUEUE_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_MESSAGE_SIGNING_KEY=${QUEUE_MESSAGE_SIGNING_KEY:?Set a private queue message signing key}
      - ASR_PROVIDER=${ASR_PROVIDER:-local}
      - ASR_LOCAL_URL=${ASR_LOCAL_URL:-http://host.docker.internal:8001}
      - DIARIZATION_LOCAL_URL=${DIARIZATION_LOCAL_URL:-http://host.docker.internal:8002}
      - ASR_TIMEOUT_SECONDS=${ASR_TIMEOUT_SECONDS:-3600}
      - DIARIZATION_TIMEOUT_SECONDS=${DIARIZATION_TIMEOUT_SECONDS:-3600}
      - ASR_CLOUD_API_KEY=${ASR_CLOUD_API_KEY:-}
      - ASR_CLOUD_ENDPOINT=${ASR_CLOUD_ENDPOINT:-}
      - SPEAKER_EXCERPT_ACTIVE_KEY_ID=${SPEAKER_EXCERPT_ACTIVE_KEY_ID:?Set a managed excerpt encryption key ID}
      - SPEAKER_EXCERPT_KEYRING=${SPEAKER_EXCERPT_KEYRING:?Set a managed versioned excerpt keyring}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
      - SUMMARIZATION_OLLAMA_URL=${SUMMARIZATION_OLLAMA_URL:-}
      - SUMMARIZATION_OLLAMA_MODEL=${SUMMARIZATION_OLLAMA_MODEL:-}
      - SUMMARIZATION_TIMEOUT_SECONDS=${SUMMARIZATION_TIMEOUT_SECONDS-900}
      - SAURI_ENGINE_TOKEN_FILE=/run/secrets/sauri_engine_token
      - SAURI_RECORDING_CAPABILITY_KEY_FILE=/run/secrets/recording_capability_key
      - MINIO_AUDIO_PREFIX=recordings/
    volumes:
      - "${HOME:?HOME must be set}/.config/sauri/engine_token:/run/secrets/sauri_engine_token:ro"
      - "${HOME:?HOME must be set}/.config/sauri/recording_capability_key:/run/secrets/recording_capability_key:ro"
    networks:
      - sauri-net

  # --- PostgreSQL ---
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sauri
      - POSTGRES_USER=sauri
      - POSTGRES_PASSWORD=sauri_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauri -d sauri"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - sauri-net

  # Repair only the RustFS data volume, using the image's verified runtime UID/GID.
  minio-volume-permissions:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    network_mode: none
    volumes:
      - minio-data:/data
    restart: "no"

  # --- MinIO (almacenamiento S3-local) ---
  minio:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    depends_on:
      minio-volume-permissions:
        condition: service_completed_successfully
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - sauri-net

  # --- RabbitMQ (broker de cola) ---
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sauri-net

volumes:
  pgdata:
  minio-data:

networks:
  sauri-net:
    driver: bridge
