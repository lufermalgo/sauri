name: sauri

services:
  # Built portal; API stays same-origin, signed media links remain direct S3.
  portal:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${PORTAL_PORT:-5173}:80"
    depends_on:
      - api
    environment:
      # Origin the browser loads signed media/thumbnails from; allowed by the portal CSP (img-src, media-src).
      - SAURI_OBJECT_STORE_ORIGIN=${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9000}
    # Hardening: nginx starts as root only to bind port 80 and drop to its worker user, so those
    # capabilities stay; everything else is dropped. State lives in tmpfs (the config is rendered at start).
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/portal-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - sauri-net

  # --- API (FastAPI) ---
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      # Credentials arrive as private read-only files (generated in ~/.config/sauri), never as values.
      - DATABASE_URL=postgresql+asyncpg://sauri@postgres:5432/sauri
      - DATABASE_PASSWORD_FILE=/run/secrets/database_password
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_PUBLIC_ENDPOINT=${OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9000}
      - OBJECT_STORE_BUCKET=sauri-recordings
      - OBJECT_STORE_ACCESS_KEY_FILE=/run/secrets/object_store_access_key
      - OBJECT_STORE_SECRET_KEY_FILE=/run/secrets/object_store_secret_key
      - QUEUE_BROKER_URL=amqp://sauri@rabbitmq:5672/
      - QUEUE_BROKER_PASSWORD_FILE=/run/secrets/queue_password
      - QUEUE_MESSAGE_SIGNING_KEY=${QUEUE_MESSAGE_SIGNING_KEY:?Set a private queue message signing key}
      - SAURI_DEFAULT_LANGUAGE=${SAURI_DEFAULT_LANGUAGE:-es}
      - ASR_PROVIDER=${ASR_PROVIDER:-local}
      - ASR_LOCAL_URL=${ASR_LOCAL_URL:-http://host.docker.internal:8001}
      - DIARIZATION_LOCAL_URL=${DIARIZATION_LOCAL_URL:-http://host.docker.internal:8002}
      - ASR_TIMEOUT_SECONDS=${ASR_TIMEOUT_SECONDS:-3600}
      - DIARIZATION_TIMEOUT_SECONDS=${DIARIZATION_TIMEOUT_SECONDS:-3600}
      - ASR_CLOUD_API_KEY=${ASR_CLOUD_API_KEY:-}
      - ASR_CLOUD_ENDPOINT=${ASR_CLOUD_ENDPOINT:-}
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      # The legacy bypass also needs APP_ENV=test; it is off here and must stay off in any real deployment.
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - APP_ENV=${APP_ENV:-production}
      # Browser origins allowed to call the API (explicit list, never "*"); the extension id is the owner's unpacked build.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - EXTENSION_ORIGINS=${EXTENSION_ORIGINS-chrome-extension://ilnkkojmkfnbdilogldabpodoobfigce}
      # /docs, /redoc and /openapi.json exist only when APP_ENV is development/test or this is "true".
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
      - SAURI_ADMIN_PASSWORD_FILE=/run/secrets/sauri_admin_password
      # Host administration service (secrets, status). Its token is mounted here and never in the worker.
      - HOST_ENGINE_URL=${HOST_ENGINE_URL:-http://host.docker.internal:8005}
      - MANAGEMENT_TOKEN_FILE=/run/secrets/management_token
    volumes:
      - "${HOME:?HOME must be set}/.config/sauri/admin_password:/run/secrets/sauri_admin_password:ro"
      - "${HOME}/.config/sauri/management_token:/run/secrets/management_token:ro"
      - "${HOME}/.config/sauri/database_password:/run/secrets/database_password:ro"
      - "${HOME}/.config/sauri/queue_password:/run/secrets/queue_password:ro"
      - "${HOME}/.config/sauri/object_store_access_key:/run/secrets/object_store_access_key:ro"
      - "${HOME}/.config/sauri/object_store_secret_key:/run/secrets/object_store_secret_key:ro"
      - "${HOME}/.config/sauri/jwt_secret:/run/secrets/jwt_secret:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Hardening. Not read_only: uploads are spooled to /tmp on disk and can be several GiB, which a
    # tmpfs (memory) cannot hold and a new named volume would add state for; the image runs as uid 10001.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sauri-net

  # --- Worker (procesamiento asíncrono: transcripción, retención) ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    # On SIGTERM the worker stops taking jobs, lets the running one finish for up to
    # WORKER_SHUTDOWN_GRACE_SECONDS and otherwise gives its claim back.
    # The Docker grace period must stay above that. `init` forwards the signal and reaps ffmpeg children.
    init: true
    stop_signal: SIGTERM
    stop_grace_period: ${SAURI_WORKER_STOP_GRACE:-600s}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      # Credentials arrive as private read-only files (generated in ~/.config/sauri), never as values.
      - DATABASE_URL=postgresql+asyncpg://sauri@postgres:5432/sauri
      - DATABASE_PASSWORD_FILE=/run/secrets/database_password
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_BUCKET=sauri-recordings
      - OBJECT_STORE_ACCESS_KEY_FILE=/run/secrets/object_store_access_key
      - OBJECT_STORE_SECRET_KEY_FILE=/run/secrets/object_store_secret_key
      - QUEUE_BROKER_URL=amqp://sauri@rabbitmq:5672/
      - QUEUE_BROKER_PASSWORD_FILE=/run/secrets/queue_password
      - QUEUE_MESSAGE_SIGNING_KEY=${QUEUE_MESSAGE_SIGNING_KEY:?Set a private queue message signing key}
      - SAURI_DEFAULT_LANGUAGE=${SAURI_DEFAULT_LANGUAGE:-es}
      - ASR_PROVIDER=${ASR_PROVIDER:-local}
      - ASR_LOCAL_URL=${ASR_LOCAL_URL:-http://host.docker.internal:8001}
      - DIARIZATION_LOCAL_URL=${DIARIZATION_LOCAL_URL:-http://host.docker.internal:8002}
      - ASR_TIMEOUT_SECONDS=${ASR_TIMEOUT_SECONDS:-3600}
      - DIARIZATION_TIMEOUT_SECONDS=${DIARIZATION_TIMEOUT_SECONDS:-3600}
      - ASR_CLOUD_API_KEY=${ASR_CLOUD_API_KEY:-}
      - ASR_CLOUD_ENDPOINT=${ASR_CLOUD_ENDPOINT:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
      - SUMMARIZATION_BASE_URL=${SUMMARIZATION_BASE_URL:-http://host.docker.internal:8003/v1}
      - SUMMARIZATION_MODEL=${SUMMARIZATION_MODEL:-qwen3.5-9b}
      - SUMMARIZATION_TIMEOUT_SECONDS=${SUMMARIZATION_TIMEOUT_SECONDS-1500}
      - SUMMARIZE_MAX_RETRIES=${SUMMARIZE_MAX_RETRIES:-1}
      - SUMMARIZE_RETRY_DELAY_SECONDS=${SUMMARIZE_RETRY_DELAY_SECONDS:-30}
      - SUMMARY_STALE_AFTER_SECONDS=${SUMMARY_STALE_AFTER_SECONDS:-4500}
      - WORKER_SHUTDOWN_GRACE_SECONDS=${WORKER_SHUTDOWN_GRACE_SECONDS:-540}
      - PROCESSING_LEASE_SECONDS=${PROCESSING_LEASE_SECONDS:-150}
      - PROCESSING_HEARTBEAT_SECONDS=${PROCESSING_HEARTBEAT_SECONDS:-30}
      - SAURI_ENGINE_TOKEN_FILE=/run/secrets/sauri_engine_token
      - SAURI_RECORDING_CAPABILITY_KEY_FILE=/run/secrets/recording_capability_key
      - MINIO_AUDIO_PREFIX=recordings/
    volumes:
      - "${HOME:?HOME must be set}/.config/sauri/engine_token:/run/secrets/sauri_engine_token:ro"
      - "${HOME:?HOME must be set}/.config/sauri/recording_capability_key:/run/secrets/recording_capability_key:ro"
      - "${HOME}/.config/sauri/database_password:/run/secrets/database_password:ro"
      - "${HOME}/.config/sauri/queue_password:/run/secrets/queue_password:ro"
      - "${HOME}/.config/sauri/object_store_access_key:/run/secrets/object_store_access_key:ro"
      - "${HOME}/.config/sauri/object_store_secret_key:/run/secrets/object_store_secret_key:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sauri-net

  # --- PostgreSQL ---
  postgres:
    # postgres:16 pinned by digest (index, resolved 2026-11-16; 16.x, same major as the existing data volume).
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=sauri
      - POSTGRES_USER=sauri
      # Used only when the volume is first created; bring-up re-applies it to existing volumes.
      - POSTGRES_PASSWORD_FILE=/run/secrets/database_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "${HOME:?HOME must be set}/.config/sauri/database_password:/run/secrets/database_password:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauri -d sauri"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - sauri-net

  # Repair only the RustFS data volume, using the image's verified runtime UID/GID.
  minio-volume-permissions:
    # alpine:3.22 pinned by digest (index, resolved 2026-11-16).
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    network_mode: none
    volumes:
      - minio-data:/data
    restart: "no"

  # --- MinIO (almacenamiento S3-local) ---
  minio:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    depends_on:
      minio-volume-permissions:
        condition: service_completed_successfully
    environment:
      - RUSTFS_ACCESS_KEY_FILE=/run/secrets/object_store_access_key
      - RUSTFS_SECRET_KEY_FILE=/run/secrets/object_store_secret_key
    volumes:
      - minio-data:/data
      - "${HOME:?HOME must be set}/.config/sauri/object_store_access_key:/run/secrets/object_store_access_key:ro"
      - "${HOME}/.config/sauri/object_store_secret_key:/run/secrets/object_store_secret_key:ro"
    networks:
      - sauri-net

  # --- RabbitMQ (broker de cola) ---
  rabbitmq:
    # rabbitmq:3-management pinned by digest (index, resolved 2026-11-16; the image already in use).
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    # Fixed node name + named volume: users and durable queues survive container recreation.
    hostname: sauri-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Bring-up creates the "sauri" user with this password and removes "guest".
      - "${HOME:?HOME must be set}/.config/sauri/queue_password:/run/secrets/queue_password:ro"
    networks:
      - sauri-net

volumes:
  pgdata:
  minio-data:
  rabbitmq-data:

networks:
  sauri-net:
    driver: bridge
